<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Vault Shield Graphic -->
  <path d="M256 70 L390 120 C390 260 256 360 256 360 C256 360 122 260 122 120 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.25" 
        stroke="#38bdf8" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Telegram Paper Airplane Motif -->
  <g transform="translate(256,220) scale(1.15) translate(-120,-115)" filter="url(#glow)">
    <path d="M40 115 L200 48 L170 190 L115 150 L85 180 L80 135 Z" fill="url(#planeGrad)"/>
    <path d="M115 150 L110 182 L132 162 Z" fill="#93c5fd"/>
    <path d="M115 150 L170 190 L200 48 Z" fill="#bae6fd"/>
  </g>

  <!-- Keyhole / Cloud Safe Dot Motif -->
  <circle cx="256" cy="415" r="16" fill="#38bdf8"/>
  <path d="M256 395 L276 435 L236 435 Z" fill="#38bdf8" opacity="0.4"/>
</svg>
